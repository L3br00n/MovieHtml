<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>My Movies</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html {
                background: #080808;
            }
            body {
                margin: 0;
                background: #080808;
                color: #fff;
                font-family: Arial, Helvetica, sans-serif;
                overflow-x: hidden;
            }
            body.no-scroll {
                overflow: hidden;
            }
            header {
                height: 70px;
                padding: 0 38px;
                background: linear-gradient(180deg, #080808 0%, rgba(8, 8, 8, 0.94) 75%, transparent);
                display: flex;
                align-items: center;
                gap: 18px;
                position: sticky;
                top: 0;
                z-index: 50;
            }
            .logo {
                color: #e50914;
                font-size: 27px;
                font-weight: 900;
                letter-spacing: -1px;
                cursor: pointer;
                white-space: nowrap;
            }
            #search {
                flex: 1;
                max-width: 500px;
                height: 40px;
                padding: 0 17px;
                border: 1px solid #444;
                border-radius: 5px;
                background: #222;
                color: #fff;
                font-size: 15px;
                outline: none;
            }
            #search:focus {
                border-color: #777;
                background: #292929;
            }
            #search::placeholder {
                color: #999;
            }
            .header-buttons {
                margin-left: auto;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .header-btn {
                border: 0;
                background: #222;
                color: #fff;
                border-radius: 5px;
                padding: 10px 13px;
                cursor: pointer;
                font-weight: bold;
            }
            .header-btn:hover {
                background: #333;
            }
            #hero {
                height: 520px;
                position: relative;
                overflow: hidden;
                background: #111;
            }
            .hero-slide {
                position: absolute;
                inset: 0;
                opacity: 0;
                transition: opacity 0.7s ease;
                background: #111 center/cover no-repeat;
            }
            .hero-slide.active {
                opacity: 1;
            }
            .hero-gradient {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                        90deg,
                        #080808 0%,
                        rgba(8, 8, 8, 0.8) 25%,
                        rgba(8, 8, 8, 0.18) 65%,
                        rgba(8, 8, 8, 0.45) 100%
                    ),
                    linear-gradient(0deg, #080808 0%, transparent 45%, rgba(0, 0, 0, 0.3) 100%);
            }
            .hero-content {
                position: absolute;
                left: 55px;
                bottom: 70px;
                max-width: 600px;
                z-index: 3;
            }
            .hero-kicker {
                color: #e50914;
                font-weight: bold;
                text-transform: uppercase;
                font-size: 13px;
                letter-spacing: 2px;
                margin-bottom: 12px;
            }
            .hero-title {
                font-size: 48px;
                font-weight: 900;
                line-height: 1.05;
                margin-bottom: 14px;
                text-shadow: 0 3px 20px #000;
            }
            .hero-meta {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                margin-bottom: 14px;
                color: #ddd;
            }
            .hero-rating {
                color: #ffd84d;
                font-weight: bold;
            }
            .hero-description {
                color: #ddd;
                line-height: 1.5;
                font-size: 15px;
                max-width: 570px;
                margin-bottom: 20px;
            }
            .hero-play {
                border: 0;
                background: #fff;
                color: #111;
                padding: 12px 23px;
                border-radius: 4px;
                font-weight: bold;
                font-size: 15px;
                cursor: pointer;
            }
            .hero-play:hover {
                background: #ddd;
            }
            .hero-dots {
                position: absolute;
                right: 40px;
                bottom: 28px;
                z-index: 5;
                display: flex;
                gap: 7px;
            }
            .hero-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #777;
                cursor: pointer;
            }
            .hero-dot.active {
                background: #fff;
            }
            #loading {
                padding: 18px 40px;
                color: #999;
                font-size: 14px;
            }
            .stats {
                padding: 0 40px;
                color: #777;
                font-size: 13px;
            }
            .filter-bar {
                padding: 16px 40px 5px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
            }
            .filter-label {
                color: #aaa;
                font-size: 13px;
                font-weight: bold;
                margin-right: 4px;
            }
            .filter-btn {
                border: 1px solid #444;
                background: #222;
                color: #ccc;
                border-radius: 20px;
                padding: 7px 13px;
                font-size: 12px;
                font-weight: bold;
                cursor: pointer;
            }
            .filter-btn:hover {
                background: #333;
            }
            .filter-btn.active {
                background: #e50914;
                border-color: #e50914;
                color: #fff;
            }
            .section {
                padding: 8px 40px 25px;
            }
            .section-title {
                font-size: 21px;
                font-weight: bold;
                margin: 18px 0 14px;
            }
            #files {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 18px;
            }
            .card {
                background: #181818;
                border-radius: 5px;
                overflow: hidden;
                cursor: pointer;
                position: relative;
                min-width: 0;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
            }
            .card:hover {
                transform: scale(1.055);
                box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
                z-index: 10;
            }
            .poster-area {
                width: 100%;
                aspect-ratio: 2/3;
                background: #181818;
                position: relative;
                overflow: hidden;
            }
            .poster {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .poster-loading {
                position: absolute;
                inset: 0;
                background: linear-gradient(110deg, #181818 8%, #292929 18%, #181818 33%);
                background-size: 200% 100%;
                animation: shimmer 1.1s infinite;
            }
            @keyframes shimmer {
                to {
                    background-position-x: -200%;
                }
            }
            .placeholder {
                width: 100%;
                height: 100%;
                background: linear-gradient(145deg, #292929, #0d0d0d);
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 20px;
                color: #999;
                font-size: 17px;
                font-weight: bold;
            }
            .movie-info {
                padding: 10px 11px 12px;
            }
            .movie-title {
                font-size: 14px;
                font-weight: bold;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .original-title {
                font-size: 11px;
                color: #777;
                text-decoration: line-through;
                margin-top: 4px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .movie-meta {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-top: 7px;
                font-size: 12px;
                color: #aaa;
            }
            .star {
                color: #ffd84d;
            }
            .rating-badge {
                padding: 3px 6px;
                border-radius: 3px;
                font-size: 10px;
                font-weight: bold;
                color: #fff;
            }
            .rating-G {
                background: #258f3d;
            }
            .rating-PG {
                background: #2979b9;
            }
            .rating-PG13 {
                background: #d28a16;
            }
            .rating-R {
                background: #b32626;
            }
            .rating-NC17 {
                background: #701313;
            }
            .rating-NR,
            .rating-NA {
                background: #555;
            }
            .hidden {
                display: none !important;
            }
            #noResults {
                display: none;
                padding: 60px;
                text-align: center;
                color: #777;
            }
            #continueSection {
                display: none;
            }
            .continue-row {
                display: flex;
                gap: 15px;
                overflow-x: auto;
                padding-bottom: 10px;
            }
            .continue-card {
                width: 230px;
                min-width: 230px;
                background: #191919;
                border-radius: 5px;
                overflow: hidden;
                cursor: pointer;
            }
            .continue-poster {
                height: 130px;
                background: #222;
                position: relative;
                overflow: hidden;
            }
            .continue-poster img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .progress {
                height: 3px;
                background: #444;
            }
            .progress-bar {
                height: 100%;
                background: #e50914;
            }
            .continue-name {
                padding: 9px;
                font-size: 13px;
                font-weight: bold;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            #playerOverlay {
                display: none;
                position: fixed;
                inset: 0;
                background: #000;
                z-index: 1000;
            }
            #playerContainer {
                width: 100%;
                height: 100%;
                position: relative;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #videoPlayer {
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
            }
            #playerTopBar {
                position: absolute;
                left: 0;
                right: 0;
                top: -70px;
                height: 70px;
                background: linear-gradient(180deg, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.7), transparent);
                z-index: 20;
                transition: top 0.3s ease;
                display: flex;
                align-items: center;
                padding: 0 24px;
            }
            #playerContainer:hover #playerTopBar,
            #playerTopBar:hover {
                top: 0;
            }
            #closePlayer {
                margin-left: auto;
                width: 45px;
                height: 45px;
                border: 0;
                border-radius: 50%;
                background: rgba(229, 9, 20, 0.95);
                color: #fff;
                font-size: 28px;
                line-height: 45px;
                text-align: center;
                cursor: pointer;
                z-index: 30;
                padding: 0;
                pointer-events: auto;
            }
            #closePlayer:hover {
                background: #ff2633;
            }
            #movieDetails {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.94);
                z-index: 900;
                overflow: auto;
            }
            .details-inner {
                max-width: 950px;
                margin: 40px auto;
                background: #181818;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 20px 70px #000;
            }
            .details-top {
                display: grid;
                grid-template-columns: 280px 1fr;
                min-height: 430px;
            }
            .details-poster {
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #222;
            }
            .details-content {
                padding: 35px;
            }
            .details-title {
                font-size: 36px;
                font-weight: 900;
                margin-bottom: 12px;
            }
            .details-original {
                font-size: 13px;
                color: #777;
                text-decoration: line-through;
                margin-top: -7px;
                margin-bottom: 14px;
            }
            .details-meta {
                display: flex;
                gap: 9px;
                align-items: center;
                flex-wrap: wrap;
                color: #bbb;
                margin-bottom: 20px;
            }
            .details-rating {
                color: #ffd84d;
                font-size: 18px;
                font-weight: bold;
            }
            .details-description {
                color: #ccc;
                line-height: 1.6;
                font-size: 15px;
                margin-bottom: 20px;
            }
            .details-actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .action-btn {
                border: 0;
                border-radius: 4px;
                padding: 12px 19px;
                font-weight: bold;
                cursor: pointer;
                background: #fff;
                color: #111;
            }
            .action-btn.dark {
                background: #333;
                color: #fff;
            }
            .action-btn.favorite {
                background: #e50914;
                color: #fff;
            }
            .details-close {
                position: fixed;
                right: 25px;
                top: 20px;
                width: 42px;
                height: 42px;
                border: 0;
                border-radius: 50%;
                background: #fff;
                color: #111;
                font-size: 25px;
                cursor: pointer;
                z-index: 10;
            }
            #settingsOverlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.9);
                z-index: 800;
                overflow: auto;
            }
            .settings-box {
                max-width: 600px;
                margin: 70px auto;
                background: #181818;
                border-radius: 8px;
                padding: 30px;
            }
            .settings-box h2 {
                margin-top: 0;
            }
            .setting-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 18px 0;
                border-bottom: 1px solid #333;
            }
            .switch {
                width: 46px;
                height: 25px;
                background: #444;
                border-radius: 20px;
                position: relative;
                cursor: pointer;
            }
            .switch.on {
                background: #e50914;
            }
            .switch:after {
                content: "";
                position: absolute;
                width: 19px;
                height: 19px;
                top: 3px;
                left: 3px;
                background: #fff;
                border-radius: 50%;
                transition: 0.2s;
            }
            .switch.on:after {
                left: 24px;
            }
            .close-settings {
                margin-top: 20px;
                background: #e50914;
                color: #fff;
                border: 0;
                padding: 11px 18px;
                border-radius: 4px;
                cursor: pointer;
            }
            .searching #hero,
            .searching #continueSection,
            .searching #featuredSection {
                display: none;
            }
            footer {
                padding: 40px;
                color: #555;
                text-align: center;
                font-size: 12px;
            }
            @media (max-width: 700px) {
                header {
                    height: auto;
                    padding: 14px 18px;
                    gap: 12px;
                    flex-wrap: wrap;
                }
                .logo {
                    font-size: 24px;
                }
                #search {
                    order: 3;
                    flex-basis: 100%;
                    max-width: none;
                }
                .header-buttons {
                    margin-left: auto;
                }
                #hero {
                    height: 440px;
                }
                .hero-content {
                    left: 25px;
                    right: 25px;
                    bottom: 55px;
                }
                .hero-title {
                    font-size: 34px;
                }
                .hero-description {
                    font-size: 13px;
                }
                .section {
                    padding: 8px 18px 22px;
                }
                .stats,
                .filter-bar {
                    padding-left: 18px;
                    padding-right: 18px;
                }
                #files {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    gap: 12px;
                }
                .card:hover {
                    transform: none;
                }
                .details-inner {
                    margin: 0;
                    min-height: 100vh;
                    border-radius: 0;
                }
                .details-top {
                    grid-template-columns: 1fr;
                }
                .details-poster {
                    height: 400px;
                }
                .details-content {
                    padding: 25px;
                }
                .details-title {
                    font-size: 29px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo" onclick="clearSearch()">MY MOVIES</div>
            <input id="search" type="text" placeholder="Search movies..." autocomplete="off" />
            <div class="header-buttons">
                <button class="header-btn" onclick="showFavorites()">My List</button>
                <button class="header-btn" onclick="openSettings()">⚙</button>
            </div>
        </header>
        <div id="hero"></div>
        <div id="loading">Loading movie list...</div>
        <div id="stats" class="stats">0 loaded • 0 total</div>
        <div id="filterBar" class="filter-bar">
            <span class="filter-label">Filter:</span>
            <button class="filter-btn" data-filter="R">R</button>
            <button class="filter-btn" data-filter="PG-13">PG-13</button>
            <button class="filter-btn" data-filter="PG">PG</button>
            <button class="filter-btn" data-filter="G">G</button>
            <button class="filter-btn" data-filter="NC-17">NC-17</button>
        </div>
        <section id="continueSection" class="section">
            <div class="section-title">Continue Watching</div>
            <div id="continueRow" class="continue-row"></div>
        </section>
        <section id="featuredSection" class="section">
            <div class="section-title">Featured</div>
        </section>
        <section class="section">
            <div id="moviesTitle" class="section-title">Movies</div>
            <div id="files"></div>
            <div id="noResults">No movies found.</div>
        </section>
        <footer>My Movies</footer>
        <div id="movieDetails">
            <button class="details-close" onclick="closeDetails()">×</button>
            <div class="details-inner">
                <div class="details-top">
                    <div id="detailsPoster"></div>
                    <div class="details-content">
                        <div id="detailsTitle" class="details-title"></div>
                        <div id="detailsOriginal" class="details-original"></div>
                        <div id="detailsMeta" class="details-meta"></div>
                        <div id="detailsDescription" class="details-description"></div>
                        <div id="detailsActions" class="details-actions"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="playerOverlay">
            <div id="playerContainer">
                <div id="playerTopBar">
                    <button id="closePlayer" type="button" aria-label="Exit movie">×</button>
                </div>
                <video id="videoPlayer" controls playsinline></video>
            </div>
        </div>
        <div id="settingsOverlay">
            <div class="settings-box">
                <h2>Settings</h2>
                <div class="setting-row">
                    <div>
                        <strong>Autoplay</strong>
                        <div style="color: #888; font-size: 12px; margin-top: 4px">
                            Try to start movies automatically
                        </div>
                    </div>
                    <div id="autoplaySwitch" class="switch on" onclick="toggleSetting('autoplay')"></div>
                </div>
                <div class="setting-row">
                    <div>
                        <strong>Featured Movies</strong>
                        <div style="color: #888; font-size: 12px; margin-top: 4px">
                            Show the rotating featured banner
                        </div>
                    </div>
                    <div id="featuredSwitch" class="switch on" onclick="toggleSetting('featured')"></div>
                </div>
                <div class="setting-row">
                    <div>
                        <strong>My List First</strong>
                        <div style="color: #888; font-size: 12px; margin-top: 4px">
                            Put favorites above other movies
                        </div>
                    </div>
                    <div id="favoritesSwitch" class="switch on" onclick="toggleSetting('favorites')"></div>
                </div>
                <button class="close-settings" onclick="closeSettings()">Close</button>
            </div>
        </div>
        <script>
            const sources = [
                { identifier: "My-Favorite-Movies_202503" },
                { identifier: "28-days-later_202505" },
                { identifier: "the-village-2004_202606" },
                { identifier: "agent-cody-banks-2003" },
                { identifier: "are-you-alone-in-the-house", file: "It.mp4" },
                { identifier: "TR_Sub_Movies" },
                { identifier: "opener_202508" },
                { identifier: "AlansCC1" },
                { identifier: "comedy-collection", bottom: true },
            ];
            const OMDB_API_KEY = "46078d7c";
            const TMDB_API_KEY = "aca84b0e81d6c2a67ca3d2f0e1e1add6";
            const FANART_API_KEY = "d5403d50f1ee41ac0e0f6583f5718427";
            const movies = [];
            const movieCards = [];
            const seenMovies = new Set();
            const infoCache = new Map();
            const posterCache = new Map();
            const settings = JSON.parse(
                localStorage.getItem("movieSettings") || '{"autoplay":true,"featured":true,"favorites":true}'
            );
            let currentDetailsMovie = null;
            let activeFilters = new Set();
            let searchMode = false;
            let heroMovies = [];
            let heroIndex = 0;
            let heroTimer = null;
            let currentPlayerMovie = null;
            let loadedCount = 0;
            const titleAliases = {
                "spiderman homecoming": {
                    display: "Spiderman Homecoming",
                    search: ["Spider-Man Homecoming", "Spiderman Homecoming", "Spider Man Homecoming"],
                    originals: ["Spider-man 6 homecoming"],
                },
                "spiderman homecoming 2017": {
                    display: "Spiderman Homecoming",
                    search: ["Spider-Man Homecoming", "Spiderman Homecoming", "Spider Man Homecoming"],
                    originals: ["Spider-man 6 homecoming"],
                },
            };
            const posterObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        const card = entry.target;
                        if (entry.isIntersecting) {
                            if (card.dataset.posterLoaded !== "1") {
                                card.dataset.posterLoaded = "1";
                                loadMovieCard(card);
                            }
                        } else {
                            if (card.dataset.posterLoaded === "1" && card.dataset.pinned !== "1") {
                                unloadPoster(card);
                            }
                        }
                    });
                },
                { rootMargin: "500px 0px" }
            );
            async function safeFetch(url, timeout = 8000) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!response.ok) return null;
                    return await response.json();
                } catch (e) {
                    clearTimeout(timer);
                    return null;
                }
            }
            async function getInternetArchiveFiles(source) {
                const data = await safeFetch(
                    `https://archive.org/metadata/${encodeURIComponent(source.identifier)}`,
                    12000
                );
                if (!data || !Array.isArray(data.files)) return [];
                let files = data.files.filter((f) => f && f.name && f.name.toLowerCase().endsWith(".mp4"));
                if (source.file) files = files.filter((f) => f.name === source.file);
                return files.map((f) => ({ ...f, identifier: source.identifier, bottom: !!source.bottom }));
            }
            async function getAllInternetArchiveFiles() {
                const results = await Promise.all(sources.map(getInternetArchiveFiles));
                const normal = [],
                    bottom = [];
                results.forEach((arr) => arr.forEach((file) => (file.bottom ? bottom.push(file) : normal.push(file))));
                return [...normal, ...bottom];
            }
            function removeEmoji(text) {
                return text
                    .replace(/[\u{1F000}-\u{1FFFF}]/gu, "")
                    .replace(/[\u{2600}-\u{27BF}]/gu, "")
                    .replace(/[\u{FE00}-\u{FE0F}]/gu, "");
            }
            function cleanMovieName(filename) {
                let name = filename.replace(/\.[^/.]+$/, "");
                name = removeEmoji(name).replace(/\+/g, " ").replace(/_/g, " ").replace(/\./g, " ");
                name = name.replace(/^[\s\-_]*\d{1,3}[\s\-_]+/, "");
                name = name.replace(/^\d{1,3}[\s\-_.]+(?=[A-Za-z])/, "");
                name = name.replace(/\(\s*(19|20)\d{2}\s*\)/g, "");
                name = name.replace(/\[\s*(19|20)\d{2}\s*\]/g, "");
                name = name.replace(/\{\s*(19|20)\d{2}\s*\}/g, "");
                name = name.replace(/\b(19|20)\d{2}\b/g, "");
                name = name.replace(
                    /\b(1080p|720p|2160p|4k|bluray|blu-ray|webrip|web-dl|hdtv|x264|x265|hevc|hdr|dvdrip|cam|proper|repack)\b/gi,
                    ""

            function normalizeTitle(title) {
                return removeEmoji(title)

            function getTitleAlias(title) {
                const normalized = normalizeTitle(title);
                if (titleAliases[normalized]) return titleAliases[normalized];
                if (
                    normalized.includes("spidermanhomecoming") ||
                    normalized.includes("spiderman6homecoming") ||
                    normalized.includes("spidermanfh")

                    return titleAliases["spiderman homecoming"];

                return null;

            function getSearchTitles(filename) {
                const base = cleanMovieName(filename);
                const titles = [];
                const add = (t) => {
                    if (t && !titles.some((x) => normalizeTitle(x) === normalizeTitle(t))) titles.push(t.trim());
                };
                const alias = getTitleAlias(base);
                if (alias) alias.search.forEach(add);
                add(base);
                if (base.toLowerCase().startsWith("the ")) add(base.substring(4));
                if (base.toLowerCase().startsWith("spiderman")) add(base.replace(/^spiderman/i, "spider-man"));
                if (base.toLowerCase().startsWith("spider man")) add(base.replace(/^spider man/i, "spider-man"));
                if (base.toLowerCase().includes("amazing spiderman"))
                    add(base.replace(/amazing\s*spiderman/i, "the amazing spider-man"));
                if (base.toLowerCase().includes("ironman")) add(base.replace(/ironman/i, "iron man"));
                const words = base.split(/\s+/);
                if (words.length > 2) for (let i = words.length - 1; i >= 2; i--) add(words.slice(0, i).join(" "));

                    7000
                );
                if (data && Array.isArray(data.results) && data.results.length) {
                    const exact = data.results.find((x) => normalizeTitle(x.title) === normalizeTitle(title));
                    const result =
                        exact || data.results.find((x) => titleWordsMatch(title, x.title)) || data.results[0];
                    infoCache.set(key, result);
                    return result;
                }
                infoCache.set(key, null);
                return null;

            async function getTMDBDetails(id) {

                    6500

            async function getMovieData(filename) {

                for (const title of titles) {
                    tmdb = await getTMDBMovie(title);
                    if (tmdb) break;

                let details = tmdb ? await getTMDBDetails(tmdb.id) : null;
                let omdb = null;
                for (const title of titles) {

                    7000

                    const pages = Object.values(data.query.pages);

                const original = normalizeTitle(movie.originalTitle || cleanMovieName(movie.file.name));
                const file = normalizeTitle(cleanMovieName(movie.file.name));
                if (title === q) return 1000;
                if (original === q) return 950;
                if (file === q) return 900;
                if (title.startsWith(q)) return 800;
                if (original.startsWith(q)) return 750;
                if (file.startsWith(q)) return 700;
                if (title.includes(q)) return 600;
                if (original.includes(q)) return 550;
                if (file.includes(q)) return 500;
                const words = q.match(/[a-z0-9]+/g) || [];
                let score = 0;
                words.forEach((word) => {
                    if (title.includes(word)) score += 70;
                    else if (original.includes(word)) score += 50;
                    else if (file.includes(word)) score += 30;
                });
                return score;

                    const show = (!query || score > 0) && filterMatch;
                    if (show) ranked.push({ movie, score });

                    ranked.sort(

                    button.className = "hero-play";
                    button.textContent = "▶ Play";
                    button.onclick = () => openPlayer(movie);
                    content.appendChild(button);
                    slide.appendChild(gradient);
                    slide.appendChild(content);
                    hero.appendChild(slide);
                });
                const dots = document.createElement("div");
                dots.className = "hero-dots";
                heroMovies.forEach((m, i) => {
                    const dot = document.createElement("div");
                    dot.className = "hero-dot" + (i === 0 ? " active" : "");
                    dot.onclick = () => showHero(i);
                    dots.appendChild(dot);
                });
                hero.appendChild(dots);
                clearInterval(heroTimer);
                heroTimer = setInterval(() => showHero((heroIndex + 1) % heroMovies.length), 6500);
            }
            function showHero(index) {
                const slides = document.querySelectorAll(".hero-slide");
                const dots = document.querySelectorAll(".hero-dot");
                if (!slides.length) return;
                heroIndex = index;
                slides.forEach((s, i) => s.classList.toggle("active", i === index));
                dots.forEach((d, i) => d.classList.toggle("active", i === index));
            }
            function escapeHTML(str) {
                return String(str || "").replace(
                    /[&<>"']/g,
                    (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[m]
                );
            }
            function openSettings() {
                document.getElementById("settingsOverlay").style.display = "block";
                document.body.classList.add("no-scroll");
                updateSettingsUI();
            }
            function closeSettings() {
                document.getElementById("settingsOverlay").style.display = "none";
                document.body.classList.remove("no-scroll");
            }
            function toggleSetting(name) {
                settings[name] = !settings[name];
                localStorage.setItem("movieSettings", JSON.stringify(settings));
                updateSettingsUI();
                if (name === "featured")
                    document.getElementById("hero").style.display = settings.featured ? "" : "none";
            }
            function updateSettingsUI() {
                document.getElementById("autoplaySwitch").classList.toggle("on", settings.autoplay);
                document.getElementById("featuredSwitch").classList.toggle("on", settings.featured);
                document.getElementById("favoritesSwitch").classList.toggle("on", settings.favorites);
            }
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (document.getElementById("playerOverlay").style.display !== "none") closePlayer();
                    else if (document.getElementById("movieDetails").style.display !== "none") closeDetails();
                    else if (document.getElementById("settingsOverlay").style.display !== "none") closeSettings();
                }
            });
            async function loadMovies() {
                const loading = document.getElementById("loading");
                try {
                    const files = await getAllInternetArchiveFiles();
                    const unique = [];
                    files.forEach((file) => {
                        const title = cleanMovieName(file.name);
                        const key = normalizeTitle(title);
                        if (!key || seenMovies.has(key)) return;
                        seenMovies.add(key);
                        unique.push(file);
                    });
                    unique.forEach((file) => {
                        const movie = {
                            id: normalizeTitle(cleanMovieName(file.name)),
                            file,
                            title: cleanMovieName(file.name),
                            displayTitle: cleanMovieName(file.name),
                            poster: null,
                            posterLoaded: false,
                            data: null,
                            rated: "NR",
                            rating: 0,
                            originalTitle: "",
                        };
                        movies.push(movie);
                        const card = createMovieCard(movie);
                        movieCards.push(card);
                        document.getElementById("files").appendChild(card);
                    });
                    updateStats();
                    loading.textContent = `Movie library ready`;
                    applyFilters();
                    renderContinue();
                    const firstBatch = movies.slice(0, 10);
                    await Promise.allSettled(firstBatch.map((m) => loadMovieCard(m.card)));
                    if (settings.featured) buildHero();
                } catch (error) {
                    console.error(error);
                    loading.textContent = "Unable to load the movie list.";
                }
            }
            loadMovies();
        </script>
    </body>
</html>
